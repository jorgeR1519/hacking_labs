version: '3.8'
services:
  gophish:
    image: gophish/gophish:latest
    container_name: phishing-server
    ports:
      - "3333:3333"   # Admin de Gophish
      - "8080:80"     # Sitio phishing falso
    networks:
      - lab-network
    restart:  unless-stopped 

  credential-catcher:
    build: ./credential_server
    container_name: credential-catcher
    ports:
      - "5000:5000"
    networks:
      - lab-network
    volumes:
      - ./credential_server/credenciales_robadas.txt:/app/credenciales_robadas.txt 
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog-server
    ports:
      - "1025:1025"  # Puerto SMTP (para enviar correos)
      - "8025:8025"  # Interfaz web (para ver correos capturados)
    networks:
      - lab-network
    restart: unless-stopped

  internal-server:
    image: nginx:alpine
    container_name: internal-server
    networks:
      - lab-network
    volumes:
      - ./internal_data:/usr/share/nginx/html:ro

networks:
  lab-network:
    driver: bridge
