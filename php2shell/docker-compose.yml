name: php2shell-lab

services:
  vulnerable:
    build:
      context: .
      args:
        PHP_VERSION: 8.2.34
    ports:
      - "127.0.0.1:8086:80"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    networks: [lab]
    security_opt:
      - no-new-privileges:true

  patched:
    build:
      context: .
      args:
        PHP_VERSION: 8.2.35
    ports:
      - "127.0.0.1:8087:80"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    networks: [lab]
    security_opt:
      - no-new-privileges:true

networks:
  lab:
    driver: bridge
